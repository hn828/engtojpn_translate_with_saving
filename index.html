<!DOCTYPE html>
<html lang = "ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>翻訳</title>
        <link rel="icon" type="image/png" href="favicon.png">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet">
        <style>
            html, body{
                touch-action: manipulation;
            }
            body{
                background-color:rgb(240, 240, 240);
                font-family:sans-serif;
                font-size: 14px;
                padding:16px;
                padding-bottom:40%;
            }
            #inputText {
                background: rgba(0, 0, 0,0.1);
                border: 1px solid rgb(204, 204, 204);
                width: 100%;        /* 親幅いっぱいまで広げる */
                font-size: 14px;
                margin: 4px auto;     /* 上下余白0、左右自動で均等 */
                margin-bottom: 4px;
                display: block;     /* margin: auto を効かせるために必要 */
                padding: 4px;       /* 内側の余白 */
                box-sizing: border-box; /* padding を含めて幅を計算 */
            }       
            #translationContainer {
            display: flex;
            flex-direction: column;
            gap: 2px;
            }
            #translationHistory {
            display: flex;
            flex-direction: column;
            gap: 3px;
            } 
            .history-block {
            padding: 0px;
            border-radius: 2px;
            background: rgba(0,0,0,0.1);
            }
            .word-block {
            margin-bottom: 0px;
            padding-bottom: 4px;
            }
            .word-block details {
            display: inline;
            padding-left: 4px;
            }
            .saveBtn{
            margin-left: 2px;
            margin-right: 0px;
            font-size: 85%;
            padding-bottom: 2px;
            padding-top: 0;
            }
            .svgIcon{
            width:20px;
            height:20px;
            }
            .word-block summary {
            cursor: pointer;
            display: inline;
            }
            .word-block div {
            padding-left:15px;
            margin-top: 0px;
            }
            #bottomArea{
                position:fixed;
                max-height:35%;
                bottom:0;
                left: 0;
                right: 0;
                display: flex;
                flex-direction: column;
            } 
            #savedWordsContainer{
            max-height:25%;
            overflow-y:auto;
            background:rgb(230,230,230);
            border-top:1px solid #ccc;
            padding:8px;
            }
            .removeBtn{
            font-size: 100%;
            padding-top:1px;
            padding-bottom: 0;
            padding-left: 5px;
            padding-right: 5px;
            }
            #tableContainer{
            bottom:0;
            left:0;
            right:0;
            background:rgb(230,230,230);
            padding-left:24px;
            padding-right:24px;
            padding-bottom:8px;            
            }
            #btnTable{
                width:100%;
                table-layout:fixed;
                border-collapse:collapse;
            }
            #btnTable td{
                height:100%;
                padding : 2px;
            }

            #btnTable button{
                display:block;
                width:100%;
                height:100%;
                box-sizing:border-box;

                white-space:normal;
                word-break:break-word;
                line-height:1.2;
            }
            .btn{
            background-color: rgba(216, 216, 216,0.5);
            border-color: rgb(79, 79, 79);
            border-style: solid;
            border-width: 0.4px;
            border-radius: 2px;
            }
            .btn:hover{
            background-color: rgba(216, 216, 216,0.9);
            }
            #labelDisplay{
            display: grid;
            text-align: center;
            cursor: default;
            box-sizing: border-box;
            background-color: rgb(230,230,230);
            margin: 0em 0em 0em 0em;
            padding-block: 1px;
            padding-inline: 6px;
            border-image: initial;
            border-collapse: separate;
            border-spacing: 2px;
            border-radius: 2px;
            font-weight: normal;
            }
            .autoSaveOn{
            background-color:rgb(196, 195, 195);
            border-width:1.6px ;
            border-style:inset;
            border-color: rgba(195, 195, 195, 0.2);
            }
            .keyboard{
                position:fixed;
                left:0;
                bottom:0;
                width:100%;
                padding:5px 3px;
                background:rgb(78, 78, 79);
                box-shadow:0 0 20px rgba(78, 78, 78,0.1);
                user-select : none;
            }
            .keyboard--hidden{
                bottom:-100%;
            }
            .keyboard__keys{
                display: grid;
                grid-template-columns: repeat(24,1fr);
            }
            .keyboard__key{
                grid-column: span 2;
                height:45px; 
                margin: 1.5px;
                border-radius: 4px;
                border: none;
                background-color:rgba(255,255,255,0.2);
                color: rgb(255,255,255);
                font-size:1.05rem ;
                outline: none;
                cursor: pointer;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                vertical-align: top;
                padding:0;
                -webkit-tap-highlight-color: transparent;
                position:relative;
            }
            .keyboard__key--wide{
                grid-column: span 4;
            }
            .keyboard__key--mid--wide{
                grid-column: span 5;
            }
            .keyboard__key--extra-wide{
                grid-column: span 16;
            }
            .keyboard__key--tall{
                grid-row: span 2;
                height:auto;
            }
            .keyboard__key:active{
                background-color:rgba(255,255,255,0.12);
            }
        </style>
    </head>
    <body>
        <input id="inputText" type="text" inputmode="latin" placeholder = "検索ワードを入力" class="use-keyboard-input">
        <div id="translationText"></div>
        <div id="translationHistory"></div>
        <div id="bottomArea">
            <div id="savedWordsContainer">
                <div id="savedWords"></div>
            </div>
            <div id="tableContainer">
                <table id="btnTable">
                    <tr id="btnTableRow">
                        <td><button id="keyboardBtn" ><i class="material-icons">keyboard</i></button></td>
                        <td><button id="autoSaveBtn">自動保存モード：off</button></td>
                        <td><button id="changeLabelBtn">ラベル：</button></td>
                        <td><button id="allDeleteBtn" >全消去</button></td>
                        <td><button id="exportBtn" >Excelデータを取得</button></td>
                    </tr>
                </table>  
            </div>
        </div>              
        <script src="xlsx.full.min.js"></script>
        <script src="script_saving_distribute.js?v-2"></script>
    </body>
</html>
