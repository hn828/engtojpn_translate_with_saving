<!DOCTYPE html>
<html lang = "ja">
    <head>
        <meta charset="UTF-8">
        <title>翻訳bbb</title>
        <link rel="icon" type="image/png" href="favicon.png">
        <style>
            body{
                background-color:rgb(240, 240, 240);
                font-family:sans-serif;
                font-size: 14px;
                padding:16px;
                padding-bottom:40%;
            }
            #inputText {
                background: rgba(0, 0, 0,0.1);
                border: 1px solid rgb(204, 204, 204);
                width: 100%;        /* 親幅いっぱいまで広げる */
                font-size: 14px;
                margin: 4px auto;     /* 上下余白0、左右自動で均等 */
                margin-bottom: 4px;
                display: block;     /* margin: auto を効かせるために必要 */
                padding: 4px;       /* 内側の余白 */
                box-sizing: border-box; /* padding を含めて幅を計算 */
            }       
            #translationContainer {
            display: flex;
            flex-direction: column;
            gap: 2px;
            }
            #translationHistory {
            display: flex;
            flex-direction: column;
            gap: 3px;
            } 
            .history-block {
            padding: 0px;
            border-radius: 2px;
            background: rgba(0,0,0,0.1);
            }
            .word-block {
            margin-bottom: 0px;
            padding-bottom: 4px;
            }
            .word-block details {
            display: inline;
            padding-left: 4px;
            
            }
            .word-block summary {
            cursor: pointer;
            display: inline;
            }
            .word-block div {
            padding-left:15px;
            margin-top: 0px;
            } 
            #savedWordsContainer{
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            max-height:35%;
            overflow-y:auto;
            background:rgb(230,230,230);
            border-top:1px solid #ccc;
            padding:8px;
            padding-bottom: 0px;
            }
            #tableContainer{
            position:fixed;
            bottom:0;
            left:0;
            right:0;
            max-height:10%;
            overflow-y:auto;
            background:rgb(230,230,230);
            padding:8px;              
            }
            #btnTable{
            position:absolute
            width 100%;        /* 親幅いっぱいまで広げる */
            display: block;     /* margin: auto を効かせるために必要 */
            margin:auto;
            }
            .btn{
            }
            #labelDisplay{
            display: grid;
            text-align: center;
            cursor: default;
            box-sizing: border-box;
            background-color: rgb(230,230,230);
            margin: 0em 0em 0em 0em;
            padding-block: 1px;
            padding-inline: 6px;
            border-image: initial;
            border-collapse: separate;
            border-spacing: 2px;
            border-radius: 2px;
            font-weight: normal;
            }
            .autoSaveOn{
            background-color:rgb(196, 195, 195);
            border-width:1.6px ;
            border-style:inset;
            border-color: rgba(195, 195, 195, 0.2);
            }
        </style>
    </head>
    <body>
        <input id="inputText" type="text" placeholder = "検索ワードを入力">
        <div id="translationText"></div>
        <div id="translationHistory"></div>
        <div id="savedWordsContainer">
            <div id="savedWords"></div>
        </div>
        <div id="tableContainer">
            <table id="btnTable">
                <tr>
                    <th><button id="autoSaveBtn" class="btn">自動保存モード：off</button></th>
                    <th><button id="changeLabelBtn" class="btn">jsで設定</button></th>
                    <th><button id="allDeleteBtn" >全消去</button></th>
                    <th><button id="exportBtn" >Excelデータを取得</button></th>
                </tr>
            </table>  
        </div>              
        <script src="xlsx.full.min.js"></script>
        <script src="script_saving_distribute.js"></script>
    </body>
</html>
